[settings]
experimental = true
lockfile = true

[tools]
node = "lts"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# ── Root tasks ────────────────────────────────────────────────────────

[tasks.install]
description = "Install all dependencies"
run = "npm install && npm --prefix packages/skills-build install"
sources = ["package.json", "packages/skills-build/package.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.validate]
description = "Validate all skills"
run = "npm --prefix packages/skills-build run validate"
sources = ["skills/**/SKILL.md", "skills/**/references/**"]

[tasks.build]
description = "Build all skills"
run = "npm --prefix packages/skills-build run build"
sources = ["skills/**/SKILL.md", "skills/**/references/**", "packages/skills-build/src/**"]
outputs = ["skills/**/AGENTS.md"]

[tasks.check]
description = "Format and lint (auto-fix)"
run = "biome check --write ."
sources = ["**/*.ts", "**/*.js", "**/*.json", "biome.json"]

[tasks."ci:check"]
description = "CI format and lint check"
run = "biome ci ."
sources = ["**/*.ts", "**/*.js", "**/*.json", "biome.json"]

[tasks.test]
description = "Run tests"
run = "vitest run"
sources = ["test/**", "skills/**"]

[tasks."cve:analyze"]
description = "Fetch CVEs, analyze patterns, generate draft reference files"
run = "npx tsx packages/skills-build/src/cve/index.ts"
